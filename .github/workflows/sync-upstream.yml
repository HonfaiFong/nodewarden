name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit hash or tag (leave blank to use upstream main)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git || true
          git fetch upstream --tags

      - name: Resolve target commit
        id: resolve
        run: |
          MANUAL_INPUT="${{ github.event.inputs.target_commit }}"

          if [ -n "$MANUAL_INPUT" ]; then
            TARGET_SHA=$(git rev-parse "$MANUAL_INPUT" 2>/dev/null)
          else
            TARGET_SHA=$(git rev-parse upstream/main)
          fi

          if [ -z "$TARGET_SHA" ]; then
            echo "Cannot resolve upstream target."
            exit 1
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET_SHA"

      - name: Merge upstream changes
        id: merge
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          if git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "Already up to date with $TARGET_SHA."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge "$TARGET_SHA" --no-commit --no-ff; then
            git commit --no-edit
          else
            # Application-code conflicts always use the upstream version.
            KEEP_OURS=false
            if git ls-files -u -- .github/workflows/sync-upstream.yml wrangler.prod.toml | grep -q .; then
              KEEP_OURS=true
            fi

            git checkout --theirs -- .
            if [ "$KEEP_OURS" = true ]; then
              git checkout --ours -- .github/workflows/sync-upstream.yml wrangler.prod.toml
            fi

            git add -A
            git commit --no-edit
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & deploy nodewarden
        if: steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm ci && npx wrangler deploy --config wrangler.prod.toml
