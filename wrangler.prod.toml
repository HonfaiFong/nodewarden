# NodeWarden 生产部署配置(独立文件,不与上游 wrangler.toml 冲突,上游更新永不冲突)
# 部署: npx wrangler deploy --config wrangler.prod.toml
# ⚠️ JWT_SECRET 不在本文件:它是 secret(不受部署影响),首次由 wrangler secret put 配置
name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"
keep_vars = false
workers_dev = false

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"
database_id = "1f1257dc-2527-40ba-acf4-0a2cb4caaea3"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"
